<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>My Songbook</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="menu-view" class="view-section">
        <header>
            <button class="header-back" onclick="navigateTo('admin-view')" title="Admin">
                <i class="fa-solid fa-gear"></i>
            </button>
            <h1>My Songbook</h1>
            <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </header>

        <div class="search-container">
            <input type="text" id="search-bar" placeholder="Search song or artist..." onkeyup="searchFilter()">
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterByType('all', this)">All</button>
            <button class="filter-tab" onclick="filterByType('favorite', this)">Favorites ❤️</button>
            <button class="filter-tab" onclick="filterByType('original', this)">Originals</button>
            <button class="filter-tab" onclick="filterByType('cover', this)">Covers</button>
        </div>

        <div class="toolbar">
            <div class="sort-tool">
                <label>Sort by: </label>
                <select id="sort-select" onchange="sortSongs()">
                    <option value="popular">Most Played 🔥</option>
                    <option value="title">Title (A-Z)</option>
                    <option value="artist">Artist (A-Z)</option>
                </select>
            </div>
            <div class="view-tool">
                <button id="btn-grid" class="active" onclick="changeView('grid')">Grid</button>
                <button id="btn-list" onclick="changeView('list')">List</button>
            </div>
        </div>

        <div class="grid-container">
            <div class="songs-grid" id="songs-list-container"></div>
        </div>
    </div>

    <div id="song-view" class="view-section hidden">
        <div class="top-bar-song">
            <button class="header-back" onclick="navigateTo('menu-view')">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="song-title-wrapper">
                <h1 id="display-title">Loading...</h1>
                <p id="display-artist" style="margin:0; font-size:13px; opacity:0.8; font-weight:500;">Artist</p>
            </div>
            <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>

        <div class="song-container" style="white-space: pre-wrap;">
            <div id="lyrics-container"></div>

            <div id="edit-container" class="hidden">
                <textarea id="edit-lyrics" class="edit-textarea"></textarea>
                <div class="edit-actions">
                    <button onclick="saveEdit()" class="btn-save" style="margin-top: 0;">Save Changes</button>
                    <button onclick="cancelEdit()" class="btn-cancel">Cancel</button>
                </div>
            </div>
        </div>

        <div class="control-bar" id="settings-panel">
            <div class="control-group">
                <span style="font-size:15px; font-weight:800;">Key:</span>
                <div style="display:flex; gap:6px;">
                    <button class="btn-small" onclick="transposeChords(-1)">-½</button>
                    <button class="btn-small" onclick="transposeChords(1)">+½</button>
                </div>
            </div>

            <div class="control-group">
                <span style="font-size:15px; font-weight:800;">Text:</span>
                <div style="display:flex; gap:6px;">
                    <button class="btn-small" onclick="changeFontSize(-2)">A-</button>
                    <button class="btn-small" onclick="changeFontSize(2)">A+</button>
                </div>
            </div>

            <div class="control-group">
                <span style="font-size:15px; font-weight:800;">Speed:</span>
                <div style="display:flex; gap:6px; align-items:center;">
                    <button class="btn-small" onclick="changeSpeed(-1)"><i class="fa-solid fa-minus"></i></button>
                    <span id="speed-text" style="font-size:16px; font-weight:800; width:24px; text-align:center; color:#000;">3</span>
                    <button class="btn-small" onclick="changeSpeed(1)"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
        </div>

        <div class="sticky-fabs">
            <button class="fab-trigger edit-actions" style="display:none; gap:0; margin:0;" id="song-actions-group">
                </button>
            <button class="fab-trigger fab-settings" onclick="document.getElementById('settings-panel').classList.toggle('open')" title="Ajustes de Afinación">
                <i class="fa-solid fa-sliders"></i>
            </button>
            <button id="btn-play" class="fab-trigger btn-main" onclick="toggleScroll()" title="Iniciar Autoscroll">
                <i class="fa-solid fa-play"></i>
            </button>
            <div style="display: flex; gap: 8px; position: fixed; top: 80px; right: 20px; z-index: 10;">
                <button class="btn-small" onclick="toggleEditMode()" title="Edit Song" style="background:var(--card-bg); width:40px; height:40px;"><i class="fa-solid fa-pen" style="font-size:14px;"></i></button>
                <button class="btn-small" onclick="deleteCurrentSong()" title="Delete" style="background:#e74c3c; color:white; width:40px; height:40px;"><i class="fa-solid fa-trash" style="font-size:14px;"></i></button>
            </div>
        </div>
    </div>

    <div id="admin-view" class="view-section hidden">
        <header>
            <button class="header-back" onclick="navigateTo('menu-view')">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h1>Admin Panel</h1>
            <div style="width: 44px;"></div> </header>

        <div class="admin-form">
            <h2>Add New Song</h2>
            <div class="field">
                <label>Song Title</label>
                <input type="text" id="admin-title" placeholder="e.g. Todavía">
            </div>
            <div class="field">
                <label>Artist Name</label>
                <input type="text" id="admin-artist" placeholder="e.g. Armando Manzanero">
            </div>
            <div class="field">
                <label>Song Type</label>
                <div class="toggle-group">
                    <label>
                        <input type="radio" name="song-type" value="cover" checked>
                        <span>Cover</span>
                    </label>
                    <label>
                        <input type="radio" name="song-type" value="original">
                        <span>Original</span>
                    </label>
                </div>
            </div>
            <div class="field">
                <label>Lyrics & Chords (Plain Text)</label>
                <textarea id="admin-lyrics" placeholder="Paste your chords and lyrics here..."></textarea>
            </div>
            <button class="btn-save" onclick="saveNewSong()">Save Song to My Songbook</button>
        </div>
    </div>

    <div id="chord-modal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 class="modal-title" id="modal-title">C</h2>
            <div id="diagram-container"></div>
            <button class="modal-close" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
