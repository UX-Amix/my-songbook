<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>My Songbook</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="menu-view" class="view-section">
        <header>
            <a href="#" onclick="navigateTo('admin-view')" style="font-size: 20px;" title="Admin">⚙️</a>
            <h1>🎸 My Songbook</h1>
            <button class="theme-btn" onclick="toggleTheme()">🌙</button>
        </header>

        <div class="search-container">
            <input type="text" id="search-bar" placeholder="Search song or artist..." onkeyup="searchFilter()">
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterByType('all', this)">All</button>
            <button class="filter-tab" onclick="filterByType('favorite', this)">Favorites ❤️</button>
            <button class="filter-tab" onclick="filterByType('original', this)">Originals</button>
            <button class="filter-tab" onclick="filterByType('cover', this)">Covers</button>
        </div>

        <div class="toolbar">
            <div class="sort-tool">
                <label>Sort by: </label>
                <select id="sort-select" onchange="sortSongs()">
                    <option value="popular">Most Played 🔥</option>
                    <option value="title">Title (A-Z)</option>
                    <option value="artist">Artist (A-Z)</option>
                </select>
            </div>
            <div class="view-tool">
                <button id="btn-grid" class="active" onclick="changeView('grid')">Grid</button>
                <button id="btn-list" onclick="changeView('list')">List</button>
            </div>
        </div>

        <div class="grid-container">
            <div class="songs-grid" id="songs-list-container"></div>
        </div>
    </div>

    <div id="song-view" class="view-section hidden">
        <div class="top-bar-song">
            <a href="#" onclick="navigateTo('menu-view')">← Back</a>
            <div>
                <button class="theme-btn" onclick="editCurrentSong()" style="margin-right: 15px;" title="Edit Song">✏️</button>
                <button class="theme-btn" onclick="deleteCurrentSong()" style="margin-right: 15px;" title="Delete Song">🗑️</button>
                <button class="theme-btn" onclick="toggleTheme()">🌙</button>
            </div>
        </div>

        <div class="song-container">
            <h2 id="display-title">Loading...</h2>
            <div id="lyrics-container"></div>
        </div>

        <div class="control-bar">
            <button id="btn-play" class="btn-main" onclick="toggleScroll()">Start</button>
            <div class="control-group">
                <span style="font-size:12px; font-weight:bold;">Text:</span>
                <button class="btn-small" onclick="changeFontSize(-2)">A-</button>
                <button class="btn-small" onclick="changeFontSize(2)">A+</button>
            </div>
            <div class="control-group">
                <span style="font-size:12px; font-weight:bold;">Key:</span>
                <button class="btn-small" onclick="transposeChords(-1)">-½</button>
                <button class="btn-small" onclick="transposeChords(1)">+½</button>
            </div>

                <span style="font-size:12px; font-weight:bold;">Spd:</span>
